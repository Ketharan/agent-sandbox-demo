# Plain-Kubernetes manifest for the demo target service.
# Works on any cluster. In OpenChoreo you'd instead create this as a *Service*
# component via the portal (see agents.portal.md); this manifest is here so the
# target is unambiguous and portable. Build/push the image from
# ../internal-billing-api/Dockerfile and set it below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-billing-api
  labels: { app: internal-billing-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: internal-billing-api }
  template:
    metadata:
      labels: { app: internal-billing-api }
    spec:
      containers:
        - name: internal-billing-api
          image: REPLACE_ME/internal-billing-api:demo   # <-- set your image ref
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: internal-billing-api
spec:
  selector: { app: internal-billing-api }
  ports:
    - port: 8080
      targetPort: 8080

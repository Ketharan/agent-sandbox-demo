# Unsandboxed baseline ClusterComponentType — applyable manifest.
# The plain-Deployment twin of ai-agent-claude-repo (verified against it).
# Differences from the sandboxed type: workloadType proxy->deployment;
# SandboxTemplate+SandboxClaim -> one apps/v1 Deployment; no kata runtimeClass/
# nodeSelector/toleration; automountServiceAccountToken NOT set to false (so the
# SA token is mounted — the "regular" side of the demo contrast).
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterComponentType
metadata:
  name: ai-agent-claude-repo-unsandboxed
  annotations:
    openchoreo.dev/display-name: "AI Agent — Claude Code (with repo, unsandboxed baseline)"
    openchoreo.dev/description: "Demo baseline: the claude-with-repo workload as a plain container (no Kata, SA token mounted)."
spec:
  workloadType: deployment

  environmentConfigs:
    openAPIV3Schema:
      type: object
      $defs:
        ResourceQuantity:
          type: object
          default: {}
          properties:
            cpu:    { type: string, default: "500m" }
            memory: { type: string, default: "1Gi" }
        ResourceRequirements:
          type: object
          properties:
            requests: { $ref: "#/$defs/ResourceQuantity" }
            limits:   { $ref: "#/$defs/ResourceQuantity" }
          default: {}
      properties:
        resources: { $ref: "#/$defs/ResourceRequirements" }
        imagePullPolicy:
          type: string
          default: IfNotPresent
          enum: [Always, IfNotPresent, Never]

  resources:
    - id: deployment
      targetPlane: dataplane
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          replicas: 1
          selector:
            matchLabels: ${metadata.podSelectors}
          template:
            metadata:
              labels: ${metadata.podSelectors}
            spec:
              initContainers:
                - name: git-clone
                  image: ${workload.container.image}
                  imagePullPolicy: ${environmentConfigs.imagePullPolicy}
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      set -e
                      BRANCH=""
                      [ -n "$GIT_REF" ] && BRANCH="--branch $GIT_REF"
                      rm -rf /workspace/repo
                      git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GIT_TOKEN"; }; f' \
                        clone --depth 1 $BRANCH "$GIT_REPO_URL" /workspace/repo
                      echo "Repository ready at /workspace/repo"
                      # Pre-pack the demo payload so the workspace is turnkey — at
                      # showtime you just ask the agent to add the dependency.
                      if [ -d /workspace/repo/demo/build-metrics-helper ]; then
                        (cd /workspace/repo/demo/build-metrics-helper && npm pack --pack-destination .. >/dev/null 2>&1) \
                          && echo "Demo payload packed: /workspace/repo/demo/build-metrics-helper-1.0.0.tgz"
                      fi
                  env: ${dependencies.toContainerEnvs()}
                  envFrom: ${configurations.toContainerEnvFrom()}
                  volumeMounts:
                    - { name: workspace, mountPath: /workspace }
              containers:
                - name: main
                  image: ${workload.container.image}
                  imagePullPolicy: ${environmentConfigs.imagePullPolicy}
                  # Seed Claude settings so interactive `claude` starts in bypass
                  # mode (no tool prompts) — you still `claude` login manually.
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      mkdir -p "$HOME/.claude"
                      printf '{"permissions":{"defaultMode":"bypassPermissions"}}' > "$HOME/.claude/settings.json"
                      exec sleep infinity
                  workingDir: /workspace/repo
                  resources:
                    requests:
                      cpu: ${environmentConfigs.resources.requests.cpu}
                      memory: ${environmentConfigs.resources.requests.memory}
                    limits:
                      cpu: ${environmentConfigs.resources.limits.cpu}
                      memory: ${environmentConfigs.resources.limits.memory}
                  env: ${dependencies.toContainerEnvs()}
                  envFrom: ${configurations.toContainerEnvFrom()}
                  volumeMounts:
                    - { name: workspace, mountPath: /workspace }
                    # DEMO: a realistic over-privileged mount. Plenty of real agent
                    # deployments mount broad host paths "for convenience"; this makes
                    # the regular side able to read the node's filesystem. read-only
                    # so the demo can't damage the node.
                    - { name: host-root, mountPath: /host, readOnly: true }
              volumes:
                - name: workspace
                  emptyDir: {}
                - name: host-root
                  hostPath: { path: /, type: Directory }

    - id: env-config
      forEach: ${configurations.toConfigEnvsByContainer()}
      var: envConfig
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${envConfig.resourceName}
          namespace: ${metadata.namespace}
        data: |
          ${envConfig.envs.transformMapEntry(index, env, {env.name: env.value})}

    - id: secret-env-external
      forEach: ${configurations.toSecretEnvsByContainer()}
      var: secretEnv
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ${secretEnv.resourceName}
          namespace: ${metadata.namespace}
        spec:
          refreshInterval: 15s
          secretStoreRef:
            name: ${dataplane.secretStore}
            kind: ClusterSecretStore
          target:
            name: ${secretEnv.resourceName}
            creationPolicy: Owner
          data: |
            ${secretEnv.envs.map(secret, {
              "secretKey": secret.name,
              "remoteRef": {
                "key": secret.remoteRef.key,
                ?"property": secret.remoteRef.?property
              }
            })}

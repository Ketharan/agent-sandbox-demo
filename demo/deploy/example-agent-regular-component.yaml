# Example instance of the unsandboxed baseline — mirrors what the portal's
# Backstage `openchoreo:component:create` action produces. Verified on k3d.
# Deploy-from-image (no build): fixed agent image + runtime env vars.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: agent-regular
  namespace: default
spec:
  autoDeploy: true
  owner:
    projectName: default
  componentType:
    kind: ClusterComponentType
    # NOTE: <workloadType>/<cct-name>, not the bare name.
    name: deployment/ai-agent-claude-repo-unsandboxed
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: agent-regular-workload
  namespace: default
spec:
  owner:
    componentName: agent-regular
    projectName: default
  container:
    image: docker/sandbox-templates:claude-code
    env:
      - { key: ANTHROPIC_MODEL, value: claude-sonnet-4-6 }
      # This repo is public, so the sentinel token = tokenless clone.
      # If you point at a PRIVATE repo, supply a real token as a secret env instead:
      #   { key: GIT_TOKEN, valueFrom: { secretKeyRef: { name: <secret>, key: token } } }
      - { key: GIT_REPO_URL, value: https://github.com/Ketharan/agent-sandbox-demo.git }
      - { key: GIT_REF, value: main }
      - { key: GIT_TOKEN, value: x-no-token }

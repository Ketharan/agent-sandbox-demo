# Regular (unsandboxed) agent — deploy-from-image Component + Workload.
# Verified on k3d. componentType.name uses the <workloadType>/<name> form.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata: { name: agent-regular, namespace: default }
spec:
  autoDeploy: true
  owner: { projectName: default }
  componentType: { kind: ClusterComponentType, name: deployment/ai-agent-claude-repo-unsandboxed }
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata: { name: agent-regular-workload, namespace: default }
spec:
  owner: { componentName: agent-regular, projectName: default }
  container:
    image: docker/sandbox-templates:claude-code
    env:
      - { key: ANTHROPIC_MODEL, value: claude-sonnet-4-6 }
      - { key: GIT_REPO_URL, value: https://github.com/Ketharan/agent-sandbox-demo.git }  # public → tokenless
      - { key: GIT_REF, value: main }
      - { key: GIT_TOKEN, value: x-no-token }

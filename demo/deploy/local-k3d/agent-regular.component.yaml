# Regular (unsandboxed) agent — deploy-from-image Component + Workload.
# Verified on k3d. componentType.name uses the <workloadType>/<name> form.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata: { name: agent-regular, namespace: default }
spec:
  autoDeploy: true
  owner: { projectName: default }
  componentType: { kind: ClusterComponentType, name: deployment/ai-agent-claude-repo-unsandboxed }
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata: { name: agent-regular-workload, namespace: default }
spec:
  owner: { componentName: agent-regular, projectName: default }
  container:
    image: docker/sandbox-templates:claude-code
    env:
      - { key: ANTHROPIC_MODEL, value: claude-sonnet-4-6 }
      - { key: GIT_REPO_URL, value: https://github.com/Ketharan/agent-sandbox-demo.git }  # public → tokenless
      - { key: GIT_REF, value: main }
      - { key: GIT_TOKEN, value: x-no-token }
      # Weaponize the REAL agent: the malicious postinstall invokes `claude`
      # (with --dangerously-skip-permissions) instead of the scripted recon.
      - { key: DEMO_AGENT, value: claude }
      # NOTE on auth: the pod has no IPv6 egress and Claude's interactive OAuth
      # login prefers IPv6 → it times out. Use an API key instead (key-auth uses
      # api.anthropic.com over IPv4, which works). The unsandboxed CCT mounts the
      # `anthropic-key` secret as a file and exports it into the shell rc, so:
      #   kubectl -n <dp-namespace> create secret generic anthropic-key --from-literal=api-key=sk-ant-...
      # then re-render the component. `claude` then runs key-authed — no login.
